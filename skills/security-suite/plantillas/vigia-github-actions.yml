# Vigía semanal para un proyecto (copiar a .github/workflows/vigia-seguridad.yml).
# Cada lunes: secretos en el historial, CVE de dependencias y revisión pasiva del sitio en vivo.
# Si algo falla abre (o actualiza) un issue "Vigía de seguridad". Solo lecturas sobre el sitio.
# Variables del repo (Settings → Variables): SITIO=https://midominio.com · DOMINIO=midominio.com
name: vigia-seguridad
on:
  schedule: [{ cron: "0 15 * * 1" }]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  vigia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0 }
      - name: Traer security-suite (scripts)
        run: |
          git clone --depth 1 https://github.com/Sibajx/Security-Suite.git /tmp/ss
          # repo privado: usa un token de solo lectura → https://x-access-token:${{ secrets.SS_TOKEN }}@github.com/...
      - name: Revisión
        id: r
        env: { SITIO: "${{ vars.SITIO }}", DOMINIO: "${{ vars.DOMINIO }}" }
        run: |
          S=/tmp/ss/skills/security-suite/scripts; mkdir -p out
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --no-banner --redact -f json -r /repo/out/gitleaks.json || true
          [ -f requirements.txt ] && pipx run pip-audit -r requirements.txt -f markdown > out/pip-audit.md || true
          [ -f package-lock.json ] && npm audit --omit=dev > out/npm-audit.txt || true
          [ -n "$SITIO" ] && bash $S/en-vivo.sh "$SITIO" > out/en-vivo.md || true
          [ -n "$DOMINIO" ] && { bash $S/subdominios.sh "$DOMINIO" out/subdominios.md; bash $S/correo-dns.sh "$DOMINIO" > out/correo-dns.md; } || true
          {
            echo "## Vigía de seguridad — $(date -u +%F)"
            n=$(python3 -c "import json;print(len(json.load(open('out/gitleaks.json'))))" 2>/dev/null || echo 0)
            echo "- Secretos en historial (gitleaks): $n"
            [ -f out/pip-audit.md ] && echo "- pip-audit: $(grep -c '^|' out/pip-audit.md || true) filas"
            [ -f out/npm-audit.txt ] && echo "- npm audit: $(grep -E 'vulnerabilit' out/npm-audit.txt | tail -1)"
            for f in out/*.md; do grep -hE '^- ❌|❌' "$f" | sed "s|^|$(basename $f): |"; done
          } > out/resumen.md
          grep -qE '❌|Secretos en historial \(gitleaks\): [1-9]|[1-9][0-9]* (high|critical)' out/resumen.md && echo "mal=1" >> "$GITHUB_OUTPUT" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: vigia, path: out/ }
      - name: Abrir o actualizar issue
        if: steps.r.outputs.mal == '1'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          n=$(gh issue list --search "Vigía de seguridad in:title" --state open --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" -F out/resumen.md; else gh issue create -t "Vigía de seguridad" -F out/resumen.md; fi
